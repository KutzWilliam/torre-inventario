version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: torre_inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: torre_inventario
    ports:
      - "5440:5432"
    volumes:
      - torre_inventario_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d torre_inventario"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  torre_inventario_pgdata:
    driver: local
